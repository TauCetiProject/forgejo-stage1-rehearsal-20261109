name: Forgejo candidate rehearsal
run-name: ${{ format('source request={0}', github.event.client_payload.request.request_id) }}
on:
  repository_dispatch:
    types: [tauceti-source-candidate-v2]
permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read
  id-token: write
jobs:
  build:
    uses: TauCetiProject/TauCetiTools/.github/workflows/pr-build.yml@08d5a676a9717444ce5a2bdd13f35a7c1ad9f40c
    with:
      tools_repository: TauCetiProject/TauCetiTools
      tools_ref: 08d5a676a9717444ce5a2bdd13f35a7c1ad9f40c
      project_ref: ${{ github.workflow_sha }}
      lean_root: TauCeti
      roadmap_dir: TauCetiRoadmap
      source_candidate_enabled: true
    secrets:
      LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
